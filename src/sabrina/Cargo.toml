[package]
name = "sabrina"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
[features]
steam = []

[dependencies]
reef_sim = { path = "../reef_sim" }
bevy = { version = "=0.20.0", default-features = false, features = ["std", "default_app", "3d_bevy_render", "pbr_anisotropy_texture", "ui_bevy_render", "scene", "bevy_winit", "x11", "wayland", "bevy_gilrs", "multi_threaded", "default_font", "audio", "wav", "jpeg"] }
bevy_render = { version = "=0.20.0", features = ["gles"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
ureq = "3"
fastrand = "2"
winit = { version = "0.30", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_XboxController", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(all(target_os = "windows", target_arch = "x86_64", target_env = "msvc"))'.dependencies]
# Ship the modern shader compiler inside the executable, not as a runtime DLL.
bevy_render = { version = "=0.20.0", features = ["statically-linked-dxc"] }

[build-dependencies]
winresource = "0.1"
