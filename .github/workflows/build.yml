name: Native build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate character assets
        run: python tools/validate_models.py
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compile
        run: cmake --build build --config Release --parallel 4
      - name: Test simulation
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Bootstrap engine (Linux)
        if: runner.os == 'Linux'
        run: ./tools/bootstrap.sh
      - name: Native runtime smoke test (Linux)
        if: runner.os == 'Linux'
        run: ./tools/run.sh --headless --fixed-fps 60 -- --smoke
      - name: Input integration test (Linux)
        if: runner.os == 'Linux'
        run: ./tools/run.sh --headless --fixed-fps 60 -- --verify-input
